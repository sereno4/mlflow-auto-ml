version: '3.8'
services:
  postgres:
    image: postgres:15
    container_name: mlflow-postgres
    environment:
      POSTGRES_USER: mlflow
      POSTGRES_PASSWORD: mlflow123
      POSTGRES_DB: mlflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./create-airflow-db.sh:/docker-entrypoint-initdb.d/create-airflow-db.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mlflow -d mlflow_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ml-network

  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    container_name: mlflow-server
    ports:
      - "5000:5000"
    volumes:
      - mlflow_artifacts:/mlflow/artifacts
      - ./mlruns:/mlflow/mlruns
    command: mlflow server --backend-store-uri postgresql://mlflow:mlflow123@postgres:5432/mlflow_db --default-artifact-root /mlflow/artifacts --host 0.0.0.0 --port 5000
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ml-network

  airflow-init:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: airflow-init
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://mlflow:mlflow123@postgres:5432/airflow_db
    volumes:
      - airflow_data:/opt/airflow
    command: bash -c "airflow db migrate && airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com || true"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ml-network
    restart: "no"

  airflow-webserver:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: airflow-webserver
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://mlflow:mlflow123@postgres:5432/airflow_db
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      MLFLOW_TRACKING_URI: http://mlflow-server:5000
    volumes:
      - ../07-airflow:/opt/airflow/dags
      - ..:/opt/airflow/mlflow-auto-ml
      - airflow_data:/opt/airflow
    command: webserver
    depends_on:
      - airflow-init
      - postgres
    networks:
      - ml-network

  airflow-scheduler:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    container_name: airflow-scheduler
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://mlflow:mlflow123@postgres:5432/airflow_db
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    volumes:
      - ../07-airflow:/opt/airflow/dags
      - ..:/opt/airflow/mlflow-auto-ml
      - airflow_data:/opt/airflow
    command: scheduler
    depends_on:
      - airflow-init
      - postgres
    networks:
      - ml-network

volumes:
  postgres_data:
  airflow_data:
  mlflow_artifacts:

networks:
  ml-network:
    driver: bridge
